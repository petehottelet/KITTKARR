<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151618">
  <meta name="description" content="A sound-reactive LED voice display with illuminated pushbutton controls, local audio playback, and optional speech generation.">
  <title>K.I.T.T. — Voice interface</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="signal.js" defer></script>

  <script src="app.js" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 4v16M16 4v16"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><path d="M6 6h12v12H6Z"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 10v4m4-8v12m5-16v20m5-16v12m4-8v4"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="m16 2 4 4-4 4M4 11V9a3 3 0 0 1 3-3h13M8 22l-4-4 4-4m12-1v2a3 3 0 0 1-3 3H4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
  </svg>
  <div class="app-shell">
    <header class="masthead">
      <div class="identity"><a class="wordmark" href="./" aria-label="KITT home">K.I.T.T.</a><span class="identity-rule"></span><span class="identity-caption">Voice interface</span></div>
      <button class="view-button" id="fullscreen" type="button"><svg class="icon"><use href="#i-expand"/></svg><span>Panel view</span></button>
    </header>

    <main class="workspace">
      <section class="instrument-section" aria-label="Interactive LED control box">
        <div class="instrument-heading"><span>VOICE MODULATOR</span><span class="signal-status" id="signal-status"><i></i><span>STANDBY</span></span></div>
        <div class="panel-wrap">
          <div class="control-box" id="control-box">
            <i class="screw screw-tl" aria-hidden="true"></i><i class="screw screw-tr" aria-hidden="true"></i>
            <i class="screw screw-bl" aria-hidden="true"></i><i class="screw screw-br" aria-hidden="true"></i>
            <div class="button-bank bank-left">
              <button class="hardware-button amber" aria-pressed="true" data-switch="air"><span>AIR</span></button>
              <button class="hardware-button amber" aria-pressed="true" data-switch="oil"><span>OIL</span></button>
              <button class="hardware-button red" aria-pressed="true" data-switch="p1"><span>P1</span></button>
              <button class="hardware-button red" aria-pressed="false" data-switch="p2"><span>P2</span></button>
            </div>
            <div class="center-bank">
              <div class="voice-window" role="img" aria-label="Three red LED columns respond to the audio being played">
                <div class="led-array" id="led-array" aria-hidden="true"></div>
                <div class="window-reflection" aria-hidden="true"></div>
              </div>
              <div class="mode-bank">
                <button class="hardware-button mode-button amber" aria-pressed="false" data-switch="auto"><span>AUTO<br>CRUISE</span></button>
                <button class="hardware-button mode-button warm-white" aria-pressed="true" data-switch="normal"><span>NORMAL<br>CRUISE</span></button>
                <button class="hardware-button mode-button red" aria-pressed="false" data-switch="pursuit"><span>PURSUIT</span></button>
              </div>
            </div>
            <div class="button-bank bank-right">
              <button class="hardware-button amber" aria-pressed="true" data-switch="s1"><span>S1</span></button>
              <button class="hardware-button amber" aria-pressed="true" data-switch="s2"><span>S2</span></button>
              <button class="hardware-button red" aria-pressed="false" data-switch="p3"><span>P3</span></button>
              <button class="hardware-button red" aria-pressed="true" data-switch="p4"><span>P4</span></button>
            </div>
          </div>
        </div>
      </section>

      <section class="audio-console" aria-label="Audio controls">
        <div class="file-drop" id="file-drop">
          <input type="file" id="audio-file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.webm">
          <label for="audio-file" class="file-label"><svg class="icon upload-icon"><use href="#i-upload"/></svg><span class="file-action" id="file-action">Choose audio file</span><span class="file-help">or drop it here · MP3, WAV, OGG & more</span></label>
        </div>
        <button class="demo-button" id="demo" type="button"><svg class="icon"><use href="#i-wave"/></svg><span>Play demo tones</span><svg class="icon arrow"><use href="#i-arrow"/></svg></button>
        <form class="speech" id="speech" hidden>
          <label class="track-label" for="speech-text">GENERATE SPEECH</label>
          <textarea id="speech-text" rows="3" maxlength="1000" placeholder="Type a line for the voice to say" aria-describedby="speech-count"></textarea>
          <div class="speech-row"><span id="speech-count">Sent to voice service · 0 / 1000</span><button class="speak-button" id="speak" type="submit" disabled><svg class="icon"><use href="#i-wave"/></svg><span>Speak</span></button></div>
        </form>
        <div class="player">
          <div class="track-info"><span class="track-label">AUDIO SOURCE</span><span id="track-name" title="No file selected">No file selected</span></div>
          <div class="transport">
            <button class="play-button" id="play" disabled type="button"><svg class="icon"><use href="#i-play"/></svg><span>Play</span></button>
            <button class="utility-button stop-button" id="stop" disabled type="button" aria-label="Stop and return to start" title="Stop and return to start"><svg class="icon"><use href="#i-stop"/></svg></button>
            <button class="utility-button loop-button" id="loop" type="button" aria-label="Loop audio" aria-pressed="false" title="Loop audio"><svg class="icon"><use href="#i-loop"/></svg></button>
          </div>
          <input class="seek" type="range" id="seek" min="0" max="1000" step="1" value="0" disabled aria-label="Playback position" aria-valuetext="0:00 of 0:00">
          <div class="time-row"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
        </div>
        <div class="adjustments">
          <div class="adjustment"><div class="adjustment-label"><label for="sensitivity">LED sensitivity</label><output for="sensitivity" id="sensitivity-value">1.0×</output></div><input type="range" id="sensitivity" min="0.25" max="3" step="0.05" value="1"></div>
          <div class="adjustment"><div class="adjustment-label"><label for="volume">Volume</label><output for="volume" id="volume-value">70%</output></div><input type="range" id="volume" min="0" max="1" step="0.01" value="0.7"></div>
        </div>
        <p class="feedback" id="feedback" role="status" aria-live="polite">Your audio stays on this device.</p>
      </section>
    </main>
  </div>
  <audio id="audio" preload="metadata"></audio>
  <noscript>This control panel needs JavaScript enabled to play audio and operate its switches.</noscript>
</body>
</html>
